# Seamless publish to the public npm registry.
#
# Push to main. The workflow compares the version in package.json against what
# is already on npm and publishes only when the version is new.
#
# To ship a release: bump "version" in package.json, commit, merge to main.
# No git tags, no manual dispatch.
#
# Requires an NPM_TOKEN secret (automation token from npmjs.com) with publish
# rights on the @inflowenger org.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      # Publish only if this exact version is not already on npm, so an ordinary
      # push that didn't bump the version is a safe no-op.
      - name: Publish if version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version already on npm — nothing to publish."
            exit 0
          fi
          echo "Publishing $name@$version"
          npm publish --access public --provenance
