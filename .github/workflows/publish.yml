# Publishes the package to the public npm registry when a version tag is pushed.
#
#   git tag v0.0.1 && git push origin v0.0.1
#
# The version that actually ships is the one in package.json; the tag must
# match it. Bump and commit package.json first, then tag.
#
# Requires an NPM_TOKEN secret (automation token from npmjs.com) with publish
# rights on the @inflowenger org.
name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      # Fails loudly if the tag and package.json version disagree, rather than
      # publishing a version nobody asked for.
      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "::error::Tag says v$tag_version but package.json says $version"
            exit 1
          fi

      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
